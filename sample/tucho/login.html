<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通帳チェッカー - Login</title>
  <link rel="icon" href="https://raw.githubusercontent.com/rsfact/assets/main/favicon.ico" type="image/x-icon" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --color-primary: #799bf9; --color-danger: #ff5151; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>
<body class="px-4 py-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-5">
      <i class="fa-solid fa-book text-[var(--color-primary)] text-xl"></i>
      <h1 class="font-bold text-xl mt-1">通帳チェッカー</h1>
    </div>
    <form id="loginForm" class="space-y-3">
      <input id="email" type="email" required placeholder="メールアドレス"
        class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" />
      <input id="password" type="password" required placeholder="パスワード"
        class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm" />
      <button id="submitButton" type="submit"
        class="w-full px-4 py-2.5 rounded-xl text-white font-semibold text-sm"
        style="background: var(--color-primary);">ログイン</button>
    </form>
    <p id="errorMessage" class="hidden text-xs text-[var(--color-danger)] mt-3"></p>
  </div>
  <script>
    const API_BASE = new URL("/snb/api", window.location.origin).toString();
    const TOKEN_KEY = "snb_customer_token";
    const params = new URLSearchParams(window.location.search);
    const boardId = params.get("board_id") || "";
    const taskId = params.get("task_id") || "";
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMessage.classList.add("hidden");
      button.disabled = true;
      button.textContent = "ログイン中...";
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { accept: "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const json = await res.json();
        if (!res.ok || !json.success || !json.data?.token) throw new Error("login failed");
        localStorage.setItem(TOKEN_KEY, json.data.token);
        const next = new URL("./index.html", window.location.href);
        if (boardId) next.searchParams.set("board_id", boardId);
        if (taskId) next.searchParams.set("task_id", taskId);
        window.location.href = next.toString();
      } catch {
        errorMessage.textContent = "ログインに失敗しました。";
        errorMessage.classList.remove("hidden");
      } finally {
        button.disabled = false;
        button.textContent = "ログイン";
      }
    });
  </script>
</body>
</html>
