<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特命タスク.com - 名刺Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%232563eb' d='M0 32v448c0 17.7 14.3 32 32 32h448c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H32C14.3 0 0 14.3 0 32zm80 96a80 80 0 1 1 0 160 80 80 0 1 1 0-160zm240 96c26.5 0 48 21.5 48 48v48H32v-48c0-26.5 21.5-48 48-48h240z'/%3E%3C/svg%3E" type="image/svg+xml" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-50: #eff6ff;
      --yellow-400: #fbbf24;
      --yellow-500: #f59e0b;
      --ink: #0f172a;
      --muted: #64748b;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 100% -20%, rgba(251, 191, 36, 0.18), transparent 50%),
        radial-gradient(ellipse 80% 60% at -10% 100%, rgba(37, 99, 235, 0.12), transparent 45%),
        #f8fafc;
      min-height: 100vh;
    }
    [x-cloak] { display: none !important; }
    .card-surface {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-accent {
      background: linear-gradient(135deg, var(--yellow-500), var(--yellow-400));
      color: #1e293b;
    }
    .folder-tree {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .folder-branch {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-left: 0.85rem;
      margin-right: 0.1rem;
      padding-left: 1rem;
    }
    .folder-row {
      display: flex;
      align-items: stretch;
      gap: 0.125rem;
      border-radius: 0.75rem;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .folder-row--root {
      margin-left: 0.2rem;
      margin-right: 0.1rem;
    }
    .folder-row--child {
      position: relative;
    }
    .folder-row--child::before,
    .folder-row--child::after {
      content: "";
      position: absolute;
      pointer-events: none;
      background: #93c5fd;
      opacity: 0.75;
    }
    .folder-row--child::after {
      left: -1rem;
      top: 0;
      bottom: 0;
      width: 1px;
    }
    .folder-row--child-first::after {
      top: -0.65rem;
    }
    .folder-row--child-last::after {
      bottom: 50%;
    }
    .folder-row--child::before {
      left: -1rem;
      top: 50%;
      width: 1rem;
      height: 1px;
    }
    .folder-row:hover {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    .folder-item--active {
      background: #eef2ff;
      border-color: #c7d2fe;
    }
    .folder-row--active .folder-row__label {
      color: #1e40af;
      font-weight: 600;
    }
    .doc-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

    /* 詳細モーダル: 項目行 */
    .detail-field-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
    }
    .detail-field-label {
      flex-shrink: 0;
      width: 4.75rem;
    }
    @media (min-width: 640px) {
      .detail-field-label { width: 7rem; }
    }

    .detail-preview-stage {
      touch-action: none;
      position: relative;
      overflow: hidden;
    }
    .detail-preview-img {
      touch-action: none;
      will-change: transform;
    }
    .detail-preview-img--grab {
      cursor: grab;
    }
    .detail-preview-img--grabbing {
      cursor: grabbing;
    }

    .detail-sheet-handle {
      flex-shrink: 0;
    }
    .detail-sheet--dragging {
      transition: none !important;
    }

    .detail-save-btn:disabled {
      cursor: default;
    }

    .list-table-icon {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 0.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.625rem;
    }
    .list-table-icon--user { background: #eff6ff; color: #2563eb; }
    .list-table-icon--company { background: #f0fdf4; color: #16a34a; }
    .list-table-icon--folder { background: #fffbeb; color: #d97706; }
    .list-table-icon--memo { background: #f8fafc; color: #64748b; }
    .list-table-icon--date { background: #f5f3ff; color: #7c3aed; }
  </style>
</head>
<body class="min-h-screen flex flex-col" x-data="cardApp()" x-init="init()" x-cloak>

  <header class="sticky top-0 z-40 border-b border-blue-100/80 bg-white/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center shrink-0 shadow-md shadow-blue-500/25">
          <i class="fa-solid fa-id-card text-sm"></i>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-bold truncate">特命タスク.com - 名刺Viewer</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-600 px-2 py-1 rounded-lg bg-slate-50">
          <i class="fa-solid fa-user text-[10px] text-blue-500"></i>
          <span x-text="userName"></span>
        </span>
        <button type="button" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" @click="exportExcel()" :disabled="!docs.length">
          <i class="fa-solid fa-file-excel text-emerald-600"></i>
          <span class="hidden sm:inline ml-1">Excel出力</span>
        </button>
        <button type="button" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" @click="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-5 flex flex-col lg:flex-row gap-4 min-h-0">

    <!-- フォルダサイドバー -->
    <aside class="lg:w-64 shrink-0 card-surface rounded-2xl p-3 flex flex-col max-h-[38vh] sm:max-h-[44vh] lg:max-h-[calc(100vh-5.5rem)]">
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wide">フォルダ</h2>
        <button type="button" class="w-8 h-8 rounded-lg btn-accent text-xs font-bold shadow-sm" title="新規フォルダ" @click="createFolderWithLoading()" :disabled="loading">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto custom-scroll -mx-1 px-1">
        <div class="folder-tree">
          <div
            class="folder-row folder-row--root"
            :class="{ 'folder-item--active folder-row--active': !selectedFolderId }"
          >
            <button
              type="button"
              class="folder-row__item flex-1 min-w-0 text-left px-3 py-2.5 flex items-center gap-2 text-sm"
              @click="selectFolder(null)"
            >
              <i class="fa-solid fa-layer-group text-blue-500 text-xs shrink-0"></i>
              <span class="folder-row__label font-medium truncate">すべての名刺</span>
            </button>
          </div>
          <div x-show="folders.length" class="folder-branch">
            <template x-for="(folder, index) in folders" :key="folder.id">
              <div
                class="folder-row folder-row--child group"
                :class="{
                  'folder-item--active folder-row--active': selectedFolderId === folder.id,
                  'folder-row--child-first': index === 0,
                  'folder-row--child-last': index === folders.length - 1
                }"
              >
                <button
                  type="button"
                  class="folder-row__item flex-1 min-w-0 text-left px-3 py-2.5 flex items-center gap-2"
                  @click="selectFolder(folder.id)"
                >
                  <i class="fa-solid fa-folder text-amber-400 text-xs shrink-0"></i>
                  <template x-if="editingFolderId !== folder.id">
                    <span class="folder-row__label text-sm font-medium truncate" x-text="folder.name"></span>
                  </template>
                  <input
                    x-show="editingFolderId === folder.id"
                    x-model.trim="editingFolderName"
                    type="text"
                    :data-folder-edit="folder.id"
                    class="flex-1 min-w-0 text-sm px-2 py-1 rounded border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    maxlength="255"
                    @click.stop
                    @keydown.esc.prevent="cancelRenameFolder()"
                  />
                </button>
                <div class="flex shrink-0 items-center pr-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition">
                  <button
                    type="button"
                    class="rounded-md shrink-0 transition"
                    :class="editingFolderId === folder.id ? 'h-7 px-2 text-[10px] font-bold text-blue-700 bg-blue-50 border border-blue-200 hover:bg-blue-100' : 'w-7 h-7 text-slate-500 hover:bg-white'"
                    :title="editingFolderId === folder.id ? '保存' : '名前変更'"
                    @click.stop="editingFolderId === folder.id ? submitRenameFolder(folder) : startRenameFolder(folder)"
                  >
                    <span x-show="editingFolderId === folder.id">保存</span>
                    <i x-show="editingFolderId !== folder.id" class="fa-solid fa-pen text-[10px]"></i>
                  </button>
                  <button type="button" class="w-7 h-7 rounded-md text-red-500 hover:bg-red-50" title="削除" @click.stop="requestDeleteFolder(folder)">
                    <i class="fa-regular fa-trash-can text-[10px]"></i>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
        <p x-show="!folders.length && !loading" class="text-xs text-slate-400 text-center py-4">フォルダがありません</p>
      </div>
    </aside>

    <!-- メイン -->
    <section class="flex-1 min-w-0 flex flex-col gap-3 min-h-0">

      <div class="card-surface rounded-2xl p-3 md:p-4 flex flex-wrap items-center gap-2">
        <div class="flex-1 min-w-[12rem] flex gap-2">
          <div class="relative flex-1 min-w-0">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input
              type="search"
              x-model="keyword"
              placeholder="氏名・会社名・メールなどで検索"
              class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
              @keydown.enter.prevent="searchDocs(1)"
            />
          </div>
          <button
            type="button"
            class="shrink-0 px-4 py-2 rounded-xl btn-primary text-sm font-semibold"
            @click="searchDocs(1)"
          >
            検索
          </button>
        </div>
        <div class="flex items-center gap-1 rounded-xl border border-slate-200 p-0.5 bg-slate-50">
          <button type="button" class="px-2.5 py-1.5 rounded-lg text-xs" :class="viewMode === 'grid' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'" @click="viewMode = 'grid'">
            <i class="fa-solid fa-grip"></i>
          </button>
          <button type="button" class="px-2.5 py-1.5 rounded-lg text-xs" :class="viewMode === 'table' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'" @click="viewMode = 'table'">
            <i class="fa-solid fa-list"></i>
          </button>
        </div>
        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto border-t sm:border-t-0 sm:border-l border-slate-100 pt-2 sm:pt-0 sm:pl-2">
          <button
            type="button"
            class="text-xs px-2 py-1 rounded-lg border transition"
            :class="allOnPageSelected() ? 'border-blue-200 bg-blue-50 text-blue-700' : 'border-slate-200 hover:bg-white text-slate-700'"
            :disabled="!docs.length"
            @click="toggleSelectAll()"
            x-text="allOnPageSelected() ? '全解除' : '全選択'"
          ></button>
          <template x-if="selectedIds.length">
            <span class="text-xs text-blue-700 font-semibold" x-text="`${selectedIds.length}件選択`"></span>
          </template>
          <template x-if="selectedIds.length">
            <button type="button" class="text-xs px-2 py-1 rounded-lg border border-slate-200 hover:bg-white" @click="clearSelection()">解除</button>
          </template>
          <template x-if="selectedIds.length">
            <button
              x-show="folders.length"
              type="button"
              class="text-xs px-2 py-1 rounded-lg border border-slate-200 hover:bg-white text-slate-700"
              @click="movePickerOpen = true"
            >移動</button>
          </template>
          <template x-if="selectedIds.length">
            <button type="button" class="text-xs px-2 py-1 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" @click="requestBatchDelete()"><i class="fa-regular fa-trash-can"></i></button>
          </template>
        </div>
      </div>

      <p x-show="selectedFolderId && currentFolderName()" class="text-sm font-semibold text-slate-700 px-1">
        <i class="fa-solid fa-folder-open text-amber-400 mr-1"></i>
        <span x-text="currentFolderName()"></span>
      </p>

      <!-- グリッド -->
      <div x-show="viewMode === 'grid'" class="flex-1 overflow-y-auto custom-scroll">
        <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 pb-20">
          <button
            type="button"
            class="doc-card min-h-[200px] rounded-2xl border-2 border-dashed border-blue-200 bg-blue-50/40 flex flex-col items-center justify-center gap-2 text-blue-700 transition"
            @click="triggerUpload()"
          >
            <span class="w-12 h-12 rounded-full btn-primary flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus"></i></span>
            <span class="text-sm font-semibold">名刺を追加</span>
          </button>
          <template x-for="doc in docs" :key="doc.id">
            <article
              class="doc-card card-surface rounded-2xl overflow-hidden border transition cursor-pointer relative"
              :class="isSelected(doc.id) ? 'ring-2 ring-blue-400 border-blue-300' : 'border-slate-200'"
              @click="onDocClick(doc, $event)"
            >
              <div class="absolute top-2 left-2 z-10" @click.stop>
                <input type="checkbox" class="w-4 h-4 accent-blue-600" :checked="isSelected(doc.id)" @change="toggleSelect(doc.id)" />
              </div>
              <div class="h-28 bg-slate-100 flex items-center justify-center overflow-hidden">
                <template x-if="isPdf(doc.url)">
                  <div class="text-center text-red-500"><i class="fa-solid fa-file-pdf text-2xl"></i><p class="text-[10px] mt-1">PDF</p></div>
                </template>
                <img x-show="!isPdf(doc.url)" :src="doc.url" alt="" class="w-full h-full object-contain" loading="lazy" />
              </div>
              <div class="p-3 space-y-1">
                <p class="text-sm font-bold truncate" x-text="cardTitle(doc)"></p>
                <p class="text-[11px] text-slate-500 truncate" x-text="cardSubtitle(doc)"></p>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-[10px] text-slate-400" x-text="formatDate(doc.created_at)"></span>
                  <span
                    x-show="doc.is_failed"
                    class="w-2 h-2 rounded-full bg-red-500"
                    title="読取エラー"
                  ></span>
                </div>
                <p x-show="doc.memo" class="text-[11px] text-slate-500 truncate" x-text="doc.memo"></p>
                <p x-show="!selectedFolderId && doc.task_name" class="text-[10px] text-blue-600 truncate">
                  <i class="fa-solid fa-folder text-[9px]"></i> <span x-text="doc.task_name"></span>
                </p>
              </div>
            </article>
          </template>
        </div>
        <p x-show="!docs.length && !loading" class="text-center text-sm text-slate-400 py-12">名刺がありません。追加してください。</p>
      </div>

      <!-- テーブル -->
      <div x-show="viewMode === 'table'" class="flex-1 overflow-auto custom-scroll card-surface rounded-2xl">
        <table class="w-full text-sm text-left">
          <thead class="text-[11px] uppercase text-slate-500 bg-slate-50 border-b sticky top-0">
            <tr>
              <th class="w-10 p-2"></th>
              <th class="p-2 font-semibold normal-case tracking-normal">
                <span class="inline-flex items-center gap-1.5">
                  <span class="list-table-icon list-table-icon--user" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
                  氏名
                </span>
              </th>
              <th class="p-2 font-semibold normal-case tracking-normal">
                <span class="inline-flex items-center gap-1.5">
                  <span class="list-table-icon list-table-icon--company" aria-hidden="true"><i class="fa-solid fa-building"></i></span>
                  会社
                </span>
              </th>
              <th x-show="!selectedFolderId" class="p-2 font-semibold normal-case tracking-normal">
                <span class="inline-flex items-center gap-1.5">
                  <span class="list-table-icon list-table-icon--folder" aria-hidden="true"><i class="fa-solid fa-folder"></i></span>
                  フォルダ
                </span>
              </th>
              <th class="p-2 font-semibold normal-case tracking-normal">
                <span class="inline-flex items-center gap-1.5">
                  <span class="list-table-icon list-table-icon--memo" aria-hidden="true"><i class="fa-solid fa-note-sticky"></i></span>
                  メモ
                </span>
              </th>
              <th class="p-2 font-semibold normal-case tracking-normal">
                <span class="inline-flex items-center gap-1.5">
                  <span class="list-table-icon list-table-icon--date" aria-hidden="true"><i class="fa-solid fa-calendar-day"></i></span>
                  登録日
                </span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-b border-blue-100 bg-blue-50/30">
              <td :colspan="selectedFolderId ? 5 : 6" class="p-0">
                <button type="button" class="w-full py-3 text-sm font-semibold text-blue-700 hover:bg-blue-50/80" @click="triggerUpload()">
                  <i class="fa-solid fa-plus mr-1"></i> 名刺を追加
                </button>
              </td>
            </tr>
            <template x-for="doc in docs" :key="doc.id">
              <tr class="border-b border-slate-100 hover:bg-blue-50/30 cursor-pointer" @click="onDocClick(doc, $event)">
                <td class="p-2" @click.stop><input type="checkbox" class="w-4 h-4 accent-blue-600" :checked="isSelected(doc.id)" @change="toggleSelect(doc.id)" /></td>
                <td class="p-2 font-medium max-w-[12rem]">
                  <span class="inline-flex items-center gap-1.5 min-w-0 max-w-full">
                    <span class="list-table-icon list-table-icon--user" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
                    <span class="truncate" x-text="cardTitle(doc)"></span>
                  </span>
                </td>
                <td class="p-2 text-slate-600 truncate max-w-[12rem]" x-text="cardSubtitle(doc) || '—'"></td>
                <td x-show="!selectedFolderId" class="p-2 text-xs text-blue-700 max-w-[10rem]">
                  <span class="inline-flex items-center gap-1.5 min-w-0 max-w-full">
                    <span class="list-table-icon list-table-icon--folder" aria-hidden="true"><i class="fa-solid fa-folder"></i></span>
                    <span class="truncate font-medium" x-text="doc.task_name || '—'"></span>
                  </span>
                </td>
                <td class="p-2 text-xs text-slate-500 max-w-[12rem]">
                  <span class="block truncate" x-text="doc.memo || '—'"></span>
                </td>
                <td class="p-2 text-xs text-slate-500 whitespace-nowrap" x-text="formatDate(doc.created_at)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <p x-show="!docs.length && !loading" class="text-center text-sm text-slate-400 py-12">名刺がありません</p>
      </div>

      <div x-show="pages > 1" class="flex justify-center gap-2 pb-4">
        <button type="button" class="px-3 py-1 rounded-lg border text-xs disabled:opacity-40" :disabled="page <= 1" @click="searchDocs(page - 1)">前へ</button>
        <span class="text-xs text-slate-500 self-center" x-text="`${page} / ${pages}`"></span>
        <button type="button" class="px-3 py-1 rounded-lg border text-xs disabled:opacity-40" :disabled="page >= pages" @click="searchDocs(page + 1)">次へ</button>
      </div>
    </section>
  </main>

  <!-- フォルダへ移動ポップアップ -->
  <div x-show="movePickerOpen" class="fixed inset-0 z-[60] flex items-center justify-center p-4" x-cloak>
    <div class="absolute inset-0 bg-black/40" @click="movePickerOpen = false"></div>
    <div class="relative w-full max-w-xs rounded-2xl border border-slate-200 bg-white p-5 shadow-2xl">
      <h3 class="font-bold text-sm mb-3">移動先フォルダを選択</h3>
      <div class="space-y-1 max-h-60 overflow-y-auto">
        <template x-for="folder in folders" :key="'mvp-' + folder.id">
          <button
            type="button"
            class="w-full text-left px-3 py-2 rounded-xl text-sm hover:bg-blue-50 flex items-center gap-2"
            @click="moveSelectedTo(folder.id); movePickerOpen = false"
          >
            <i class="fa-solid fa-folder text-amber-400 text-xs"></i>
            <span x-text="folder.name"></span>
          </button>
        </template>
      </div>

  <script>
    function cardApp() {
      const params = new URLSearchParams(window.location.search);
      const TOKEN_KEYS = ["snb_customer_token", "snb_token"];
      const NAME_KEYS = ["snb_customer_name", "snb_user_name"];
      const PAGE_SIZE = 30;

      const CARD_FIELD_LABELS = {
        name: "氏名",
        company_name: "会社名",
        department: "部署",
        role: "肩書き",
        email: "メールアドレス",
        url: "URL",
        tel: "電話番号",
        address: "住所",
        post_code: "郵便番号",
        remarks: "備考",
        ref_number: "参照番号",
      };

      const EDIT_FIELD_ICONS = {
        name: "fa-solid fa-user",
        company_name: "fa-solid fa-building",
        department: "fa-solid fa-sitemap",
        role: "fa-solid fa-briefcase",
        email: "fa-solid fa-envelope",
        tel: "fa-solid fa-phone",
        post_code: "fa-solid fa-location-dot",
        address: "fa-solid fa-map-location-dot",
        url: "fa-solid fa-link",
        ref_number: "fa-solid fa-hashtag",
        remarks: "fa-solid fa-note-sticky",
      };

      function cardFieldDef(key) {
        return { key, label: CARD_FIELD_LABELS[key], aliases: [key] };
      }

      /** 名刺項目の表示・編集・Excel 共通順 */
      const CARD_FIELD_KEYS = [
        "name",
        "company_name",
        "department",
        "role",
        "email",
        "tel",
        "post_code",
        "address",
        "url",
        "ref_number",
        "remarks",
      ];

      /** Excel 列順（参照番号を1列目） */
      const EXCEL_FIELD_DEFS = [
        "ref_number",
        ...CARD_FIELD_KEYS.filter((key) => key !== "ref_number"),
      ].map(cardFieldDef);

      /** 詳細編集可能項目 */
      const EDIT_FIELD_DEFS = CARD_FIELD_KEYS.map((key) => ({
        ...cardFieldDef(key),
        icon: EDIT_FIELD_ICONS[key],
      }));

      function pickOutputValue(content, aliases) {
        for (const key of aliases) {
          const v = content?.[key];
          if (v != null && String(v).trim() !== "") return String(v);
        }
        return "";
      }

      function readToken() {
        for (const key of TOKEN_KEYS) {
          const token = localStorage.getItem(key);
          if (token) return token;
        }
        return "";
      }

      function clearAuth() {
        for (const key of TOKEN_KEYS) localStorage.removeItem(key);
        for (const key of NAME_KEYS) localStorage.removeItem(key);
      }

      function readUserName() {
        for (const key of NAME_KEYS) {
          const name = localStorage.getItem(key);
          if (name) return name;
        }
        return "ゲスト";
      }

      return {
        baseUrl: new URL(
          "/snb/api",
          location.protocol === "file:" || location.origin === "null"
            ? "https://p01-ynk002a.yoneoka.work"
            : location.origin
        ).toString().replace(/\/$/, ""),
        boardId: "",
        selectedFolderId: null,
        token: "",
        userName: "ゲスト",
        ruleName: "",
        folders: [],
        docs: [],
        groups: [],
        keyword: "",
        page: 1,
        pages: 1,
        viewMode: "grid",
        selectedIds: [],
        loading: false,
        loadingText: "読み込み中...",
        uploadMode: false,
        uploadProgress: 0,
        uploadDoneOpen: false,
        editingFolderId: null,
        editingFolderName: "",
        detailOpen: false,
        detailDoc: null,
        detailFields: [],
        detailMemo: "",
        detailMemoOriginal: "",
        detailMemoSaving: false,
        uploadPickerOpen: false,
        uploadChoiceOpen: false,
        pendingUploadFiles: null,
        movePickerOpen: false,
        confirmOpen: false,
        confirmTitle: "",
        confirmMessage: "",
        confirmAction: null,
        pendingUploadTarget: null,
        toasts: [],
        imageZoomScale: 1,
        imageZoomOrigin: { x: 50, y: 50 },
        imagePanX: 0,
        imagePanY: 0,
        imageDragging: false,
        imageDragStart: null,
        imageTouchMode: null,
        imagePinchStartDistance: null,
        imagePinchStartScale: 1,
        detailSheetDragY: 0,
        detailSheetDragging: false,
        detailSheetTouchStart: null,

        init() {
          this.boardId = params.get("board_id") || "";
          const urlTaskId = params.get("task_id") || "";
          this.token = readToken();
          this.userName = readUserName();
          if (!this.boardId || !this.token) {
            this.redirectLogin();
            return;
          }
          this.selectedFolderId = urlTaskId || null;
          this.bootstrap();
        },

        api(path, options = {}) {
          return fetch(`${this.baseUrl}/v1${path}`, {
            ...options,
            headers: {
              accept: "application/json",
              Authorization: `Bearer ${this.token}`,
              ...(options.headers || {})
            }
          });
        },

        async apiJson(path, options = {}) {
          const res = await this.api(path, options);
          const json = await res.json().catch(() => ({}));
          if (res.status === 401) {
            clearAuth();
            this.redirectLogin();
            throw new Error("unauthorized");
          }
          if (!res.ok || json.success === false) throw new Error("api error");
          return json;
        },

        redirectLogin() {
          const u = new URL("./login.html", window.location.href);
          if (this.boardId) u.searchParams.set("board_id", this.boardId);
          if (this.selectedFolderId) u.searchParams.set("task_id", this.selectedFolderId);
          window.location.replace(u.toString());
        },

        logout() {
          clearAuth();
          this.redirectLogin();
        },

        syncUrl() {
          const u = new URL(window.location.href);
          u.searchParams.set("board_id", this.boardId);
          if (this.selectedFolderId) u.searchParams.set("task_id", this.selectedFolderId);
          else u.searchParams.delete("task_id");
          window.history.replaceState({}, "", u.toString());
        },

        toast(msg, type = "ok") {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, msg, type });
          setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 2800);
        },

        setLoading(on, text = "読み込み中...") {
          this.loading = on;
          this.loadingText = text;
        },

        async bootstrap() {
          this.setLoading(true);
          try {
            await this.loadRule();
            await this.loadFolders();
            await this.searchDocs(1);
          } catch {
            this.toast("初期化に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        async loadRule() {
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/rule`);
          const d = json.data || {};
          this.ruleName = d.name || "名刺管理";
        },

        async loadFolders() {
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page: 1, size: 200 })
          });
          this.folders = json.data?.items || [];
          if (this.selectedFolderId && !this.folders.some((f) => f.id === this.selectedFolderId)) {
            this.selectedFolderId = null;
          }
        },

        flattenGroups(groups) {
          return (groups || []).flatMap((g) =>
            (g.imgs || []).map((img) => ({
              ...img,
              task_name: g.task?.name || ""
            }))
          );
        },

        async searchDocs(targetPage = 1) {
          this.setLoading(true, "名刺を検索中...");
          try {
            const taskId = encodeURIComponent(this.selectedFolderId || "~all");
            const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${taskId}/search`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                page: targetPage,
                size: PAGE_SIZE,
                keyword: this.keyword.trim() || "",
                is_done: true,
                sort: "created_at_desc"
              })
            });
            this.groups = json.data?.items || [];
            this.docs = this.flattenGroups(this.groups);
            this.page = json.data?.page || targetPage;
            this.pages = json.data?.pages || 1;
            const ids = new Set(this.docs.map((d) => d.id));
            this.selectedIds = this.selectedIds.filter((id) => ids.has(id));
          } catch {
            this.toast("検索に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        selectFolder(id) {
          this.selectedFolderId = id;
          this.clearSelection();
          this.syncUrl();
          this.searchDocs(1);
        },

        currentFolderName() {
          if (!this.selectedFolderId) return "";
          return this.folders.find((f) => f.id === this.selectedFolderId)?.name || "";
        },

        defaultFolderName() {
          return new Date().toLocaleString("ja-JP", {
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", hour12: false
          });
        },

        async createFolder({ notify = true } = {}) {
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: this.defaultFolderName() })
          });
          await this.loadFolders();
          if (json.data?.id) this.selectFolder(json.data.id);
          if (notify) this.toast("フォルダを作成しました");
          return json.data?.id || null;
        },

        async createFolderWithLoading() {
          this.setLoading(true, "フォルダを作成中...");
          try {
            await this.createFolder();
          } catch {
            this.toast("フォルダ作成に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        startRenameFolder(folder) {
          this.editingFolderId = folder.id;
          this.editingFolderName = folder.name || "";
          this.$nextTick(() => {
            const el = document.querySelector(`[data-folder-edit="${folder.id}"]`);
            el?.focus();
            el?.select();
          });
        },

        cancelRenameFolder() {
          this.editingFolderId = null;
          this.editingFolderName = "";
        },

        async submitRenameFolder(folder) {
          if (this.editingFolderId !== folder.id) return;
          const name = this.editingFolderName.trim();
          if (!name || name === folder.name) {
            this.cancelRenameFolder();
            return;
          }
          this.setLoading(true);
          try {
            await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(folder.id)}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name })
            });
            folder.name = name;
            this.cancelRenameFolder();
            await this.searchDocs(this.page);
            this.toast("フォルダ名を変更しました");
          } catch {
            this.toast("フォルダ名の変更に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        requestDeleteFolder(folder) {
          this.confirmTitle = "フォルダを削除しますか？";
          this.confirmMessage = `「${folder.name}」と中の名刺をすべて削除します。\nこの操作は取り消せません。`;
          this.confirmAction = () => this.deleteFolder(folder);
          this.confirmOpen = true;
        },

        async deleteFolder(folder) {
          this.setLoading(true);
          try {
            await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(folder.id)}`, {
              method: "DELETE"
            });
            if (this.selectedFolderId === folder.id) this.selectedFolderId = null;
            await this.loadFolders();
            await this.searchDocs(1);
            this.syncUrl();
            this.toast("フォルダを削除しました");
          } catch {
            this.toast("フォルダの削除に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        isSelected(id) { return this.selectedIds.includes(id); },
        toggleSelect(id) {
          if (this.isSelected(id)) this.selectedIds = this.selectedIds.filter((x) => x !== id);
          else this.selectedIds = [...this.selectedIds, id];
        },
        allOnPageSelected() {
          if (!this.docs.length) return false;
          return this.docs.every((doc) => this.selectedIds.includes(doc.id));
        },
        toggleSelectAll() {
          if (!this.docs.length) return;
          if (this.allOnPageSelected()) {
            this.clearSelection();
            return;
          }
          this.selectedIds = this.docs.map((doc) => doc.id);
        },
        clearSelection() { this.selectedIds = []; },

        onDocClick(doc, event) {
          if (event?.target?.closest?.('input[type="checkbox"], button')) return;
          if (this.selectedIds.length) {
            this.toggleSelect(doc.id);
            return;
          }
          this.openDetail(doc);
        },

        getOutputContent(output) {
          if (!output || typeof output !== "object") return {};
          if (output.content && typeof output.content === "object") return { ...output.content };
          return { ...output };
        },

        cardTitle(doc) {
          const c = this.getOutputContent(doc.output);
          return c.name || "（氏名なし）";
        },

        cardSubtitle(doc) {
          const c = this.getOutputContent(doc.output);
          return c.company_name || c.department || "";
        },

        formatDate(iso) {
          if (!iso) return "—";
          try {
            return new Date(iso).toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
          } catch { return iso; }
        },

        isPdf(url) {
          return String(url || "").split("?")[0].toLowerCase().endsWith(".pdf");
        },

        canZoomDetailImage() {
          if (!this.detailDoc?.url) return false;
          return !this.isPdf(this.detailDoc.url);
        },

        isFieldDirty(field) {
          return String(field?.value ?? "") !== String(field?.originalValue ?? "");
        },

        isMemoDirty() {
          return String(this.detailMemo ?? "") !== String(this.detailMemoOriginal ?? "");
        },

        resetDetailSheetDrag() {
          this.detailSheetDragY = 0;
          this.detailSheetDragging = false;
          this.detailSheetTouchStart = null;
        },

        detailSheetDragStyle() {
          if (this.detailSheetDragY <= 0) return {};
          return { transform: `translateY(${this.detailSheetDragY}px)` };
        },

        isDetailSheetSwipeTarget(event) {
          const tag = String(event.target?.tagName || "").toUpperCase();
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON" || tag === "IFRAME") return false;
          if (event.target?.closest?.(".detail-preview-img")) return false;
          return true;
        },

        onDetailSheetTouchStart(event) {
          if (event.touches.length !== 1 || !this.isDetailSheetSwipeTarget(event)) return;
          const scrollEl = this.$refs.detailScrollBody;
          this.detailSheetTouchStart = {
            y: event.touches[0].clientY,
            scrollTop: scrollEl?.scrollTop || 0,
          };
          this.detailSheetDragging = false;
        },

        onDetailSheetTouchMove(event) {
          if (!this.detailSheetTouchStart || event.touches.length !== 1) return;
          const dy = event.touches[0].clientY - this.detailSheetTouchStart.y;
          if (dy <= 0) return;
          if (this.detailSheetTouchStart.scrollTop > 0) return;
          if (dy > 6) {
            this.detailSheetDragging = true;
            this.detailSheetDragY = dy;
          }
        },

        onDetailSheetTouchEnd() {
          if (this.detailSheetDragY > 90) this.closeDetail();
          this.resetDetailSheetDrag();
        },

        getTouchDistance(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.hypot(dx, dy);
        },

        onImageTouchStart(event) {
          if (!this.canZoomDetailImage()) return;
          if (event.touches.length === 2) {
            this.imageTouchMode = "pinch";
            this.imagePinchStartDistance = this.getTouchDistance(event.touches);
            this.imagePinchStartScale = this.imageZoomScale;
            return;
          }
          if (event.touches.length === 1) {
            this.imageTouchMode = "pan";
            this.imageDragStart = {
              clientX: event.touches[0].clientX,
              clientY: event.touches[0].clientY,
              panX: this.imagePanX,
              panY: this.imagePanY,
            };
          }
        },

        onImageTouchMove(event) {
          if (!this.canZoomDetailImage()) return;
          if (this.imageTouchMode === "pinch" && event.touches.length === 2 && this.imagePinchStartDistance) {
            const dist = this.getTouchDistance(event.touches);
            const ratio = dist / this.imagePinchStartDistance;
            this.imageZoomScale = Math.min(5, Math.max(0.4, Number((this.imagePinchStartScale * ratio).toFixed(2))));
            return;
          }
          if (this.imageTouchMode === "pan" && event.touches.length === 1 && this.imageDragStart) {
            this.imagePanX = this.imageDragStart.panX + (event.touches[0].clientX - this.imageDragStart.clientX);
            this.imagePanY = this.imageDragStart.panY + (event.touches[0].clientY - this.imageDragStart.clientY);
          }
        },

        onImageTouchEnd(event) {
          if (event.touches.length >= 2) return;
          if (event.touches.length === 1 && this.imageTouchMode === "pinch") {
            this.imageTouchMode = "pan";
            this.imagePinchStartDistance = null;
            this.imageDragStart = {
              clientX: event.touches[0].clientX,
              clientY: event.touches[0].clientY,
              panX: this.imagePanX,
              panY: this.imagePanY,
            };
            return;
          }
          this.imageTouchMode = null;
          this.imageDragStart = null;
          this.imagePinchStartDistance = null;
        },

        resetImageZoom() {
          this.imageZoomScale = 1;
          this.imageZoomOrigin = { x: 50, y: 50 };
          this.imagePanX = 0;
          this.imagePanY = 0;
          this.imageDragging = false;
          this.imageDragStart = null;
          this.imageTouchMode = null;
          this.imagePinchStartDistance = null;
          this.imagePinchStartScale = 1;
        },

        imageZoomStyle() {
          const o = this.imageZoomOrigin;
          return {
            transform: `translate(${this.imagePanX}px, ${this.imagePanY}px) scale(${this.imageZoomScale})`,
            transformOrigin: `${o.x}% ${o.y}%`,
          };
        },

        imagePanCursorClass() {
          if (!this.canZoomDetailImage()) return "";
          if (this.imageDragging) return "detail-preview-img--grabbing";
          return "detail-preview-img--grab";
        },

        onImagePointerDown(event) {
          if (!this.canZoomDetailImage()) return;
          if (event.pointerType === "touch") return;
          if (event.button !== 0) return;
          event.preventDefault();
          this.imageDragging = true;
          this.imageDragStart = {
            clientX: event.clientX,
            clientY: event.clientY,
            panX: this.imagePanX,
            panY: this.imagePanY,
          };
          event.currentTarget?.setPointerCapture?.(event.pointerId);
        },

        onImagePointerMove(event) {
          if (event.pointerType === "touch") return;
          if (!this.imageDragging || !this.imageDragStart) return;
          event.preventDefault();
          this.imagePanX = this.imageDragStart.panX + (event.clientX - this.imageDragStart.clientX);
          this.imagePanY = this.imageDragStart.panY + (event.clientY - this.imageDragStart.clientY);
        },

        onImagePointerUp(event) {
          if (event.pointerType === "touch") return;
          if (!this.imageDragging) return;
          this.imageDragging = false;
          this.imageDragStart = null;
          try {
            event.currentTarget?.releasePointerCapture?.(event.pointerId);
          } catch {
            /* pointer already released */
          }
        },

        zoomInImage() {
          this.imageZoomScale = Math.min(5, Number((this.imageZoomScale + 0.2).toFixed(2)));
        },

        zoomOutImage() {
          this.imageZoomScale = Math.max(0.4, Number((this.imageZoomScale - 0.2).toFixed(2)));
        },

        handleImageZoomWheel(event) {
          if (!this.canZoomDetailImage()) return;
          const target = this.$refs.detailPreviewImage || event.currentTarget;
          const rect = target?.getBoundingClientRect?.();
          if (rect && rect.width > 0 && rect.height > 0) {
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            this.imageZoomOrigin = {
              x: Math.min(100, Math.max(0, x)),
              y: Math.min(100, Math.max(0, y)),
            };
          }
          if (event.deltaY < 0) {
            this.zoomInImage();
          } else {
            this.zoomOutImage();
          }
        },

        openDetail(doc) {
          this.resetImageZoom();
          this.detailDoc = doc;
          const content = this.getOutputContent(doc.output);
          this.detailFields = EDIT_FIELD_DEFS.map((def) => {
            const value = pickOutputValue(content, def.aliases);
            return {
              key: def.key,
              label: def.label,
              icon: def.icon,
              value,
              originalValue: value,
              saving: false,
            };
          });
          this.detailMemo = doc.memo || "";
          this.detailMemoOriginal = doc.memo || "";
          this.detailMemoSaving = false;
          this.resetDetailSheetDrag();
          this.detailOpen = true;
        },

        closeDetail() {
          this.detailOpen = false;
          this.detailDoc = null;
          this.detailFields = [];
          this.detailMemo = "";
          this.detailMemoOriginal = "";
          this.detailMemoSaving = false;
          this.resetImageZoom();
          this.resetDetailSheetDrag();
        },

        buildOutput() {
          const output = this.detailDoc?.output && typeof this.detailDoc.output === "object"
            ? JSON.parse(JSON.stringify(this.detailDoc.output))
            : {};
          const content = {};
          this.detailFields.forEach((f) => { content[f.key] = f.value; });
          if (output.content && typeof output.content === "object") {
            output.content = { ...output.content, ...content };
          } else {
            return { ...output, ...content };
          }
          return output;
        },

        syncDetailDocLocally(output) {
          if (!this.detailDoc) return;
          this.detailDoc.output = output;
          const row = this.docs.find((d) => d.id === this.detailDoc.id);
          if (row) row.output = output;
        },

        async saveDetailField(field) {
          if (!this.detailDoc || !field || field.saving) return;
          field.saving = true;
          try {
            const output = this.buildOutput();
            await this.apiJson(
              `/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(this.detailDoc.task_id)}/imgs/${encodeURIComponent(this.detailDoc.id)}`,
              {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ output })
              }
            );
            this.syncDetailDocLocally(output);
            field.originalValue = field.value;
            this.toast("保存しました");
          } catch {
            this.toast("保存に失敗しました", "error");
          } finally {
            field.saving = false;
          }
        },

        async saveDetailMemo() {
          if (!this.detailDoc || this.detailMemoSaving) return;
          this.detailMemoSaving = true;
          try {
            const memo = this.detailMemo.trim();
            await this.patchDoc(this.detailDoc, { memo: memo || null });
            this.detailDoc.memo = memo;
            this.detailMemoOriginal = memo;
            const row = this.docs.find((d) => d.id === this.detailDoc.id);
            if (row) row.memo = memo;
            this.toast("メモを保存しました");
          } catch {
            this.toast("メモの保存に失敗しました", "error");
          } finally {
            this.detailMemoSaving = false;
          }
        },

        async patchDoc(doc, body) {
          await this.apiJson(
            `/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(doc.task_id)}/imgs/${encodeURIComponent(doc.id)}`,
            { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
          );
        },

        async moveSelectedTo(folderId) {
          const targets = this.docs.filter((d) => this.selectedIds.includes(d.id) && d.task_id !== folderId);
          if (!targets.length) return;
          this.setLoading(true, "移動中...");
          try {
            for (const doc of targets) await this.patchDoc(doc, { task_id: folderId });
            this.clearSelection();
            await this.searchDocs(this.page);
            this.toast(`${targets.length}件を移動しました`);
          } catch {
            this.toast("移動に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        requestDeleteDoc(doc) {
          this.confirmTitle = "名刺を削除しますか？";
          this.confirmMessage = "この操作は取り消せません。";
          this.confirmAction = () => this.deleteDoc(doc);
          this.confirmOpen = true;
        },

        requestBatchDelete() {
          this.confirmTitle = "選択した名刺を削除しますか？";
          this.confirmMessage = `${this.selectedIds.length}件を削除します。`;
          this.confirmAction = () => this.batchDelete();
          this.confirmOpen = true;
        },

        runConfirm() {
          this.confirmOpen = false;
          this.confirmAction?.();
          this.confirmAction = null;
        },

        async deleteDoc(doc) {
          this.setLoading(true);
          try {
            await this.apiJson(
              `/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(doc.task_id)}/imgs/${encodeURIComponent(doc.id)}`,
              { method: "DELETE" }
            );
            await this.searchDocs(this.page);
            this.toast("削除しました");
          } catch {
            this.toast("削除に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        async batchDelete() {
          const targets = this.docs.filter((d) => this.selectedIds.includes(d.id));
          this.setLoading(true);
          try {
            for (const doc of targets) {
              await this.apiJson(
                `/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(doc.task_id)}/imgs/${encodeURIComponent(doc.id)}`,
                { method: "DELETE" }
              );
            }
            this.clearSelection();
            await this.searchDocs(this.page);
            this.toast(`${targets.length}件を削除しました`);
          } catch {
            this.toast("削除に失敗しました", "error");
          } finally {
            this.setLoading(false);
          }
        },

        async triggerUpload() {
          if (!this.folders.length) {
            this.setLoading(true, "フォルダを作成中...");
            try {
              const id = await this.createFolder({ notify: false });
              if (!id) throw new Error("create folder");
            } catch {
              this.toast("フォルダ作成に失敗しました", "error");
              return;
            } finally {
              this.setLoading(false);
            }
          }
          if (this.selectedFolderId) {
            this.pendingUploadTarget = this.selectedFolderId;
            this.$refs.fileInput.click();
            return;
          }
          if (this.folders.length === 1) {
            this.pendingUploadTarget = this.folders[0].id;
            this.$refs.fileInput.click();
            return;
          }
          this.uploadPickerOpen = true;
        },

        uploadToFolder(folderId) {
          this.uploadPickerOpen = false;
          this.pendingUploadTarget = folderId;
          this.$refs.fileInput.click();
        },

        onFilesSelected(event) {
          const files = Array.from(event.target?.files || []);
          event.target.value = "";
          if (!files.length || !this.pendingUploadTarget) return;
          this.pendingUploadFiles = files;
          this.uploadChoiceOpen = true;
        },

        cancelUploadChoice() {
          this.uploadChoiceOpen = false;
          this.pendingUploadFiles = null;
          this.pendingUploadTarget = null;
        },

        confirmUploadChoice(isDone) {
          const files = this.pendingUploadFiles;
          const taskId = this.pendingUploadTarget;
          this.uploadChoiceOpen = false;
          this.pendingUploadFiles = null;
          this.pendingUploadTarget = null;
          if (!files?.length || !taskId) return;
          this.runUpload(files, taskId, isDone);
        },

        async runUpload(files, taskId, isDone) {
          let done = 0;
          let failed = 0;
          this.uploadMode = true;
          this.uploadProgress = 0;
          this.setLoading(true, `アップロード中... 0 / ${files.length}`);
          try {
            for (let i = 0; i < files.length; i++) {
              try {
                const fd = new FormData();
                fd.append("img", files[i]);
                fd.append("is_done", isDone ? "true" : "false");
                const res = await this.api(
                  `/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(taskId)}/imgs`,
                  { method: "POST", body: fd }
                );
                const json = await res.json().catch(() => ({}));
                if (!res.ok || !json.success) throw new Error("upload");
                done++;
              } catch {
                failed++;
              }
              this.uploadProgress = (i + 1) / files.length;
              this.loadingText = `アップロード中... ${i + 1} / ${files.length}`;
            }
            if (!this.selectedFolderId) await this.loadFolders();
            await this.searchDocs(1);
            if (!this.selectedFolderId) this.selectFolder(taskId);
            if (failed > 0) this.toast(`${failed}件のアップロードに失敗しました`, "error");
          } finally {
            this.uploadMode = false;
            this.uploadProgress = 0;
            this.setLoading(false);
            if (done > 0 && !isDone) {
              this.uploadDoneOpen = true;
              setTimeout(() => { this.uploadDoneOpen = false; }, 2000);
            }
          }
        },

        exportExcel() {
          if (!this.docs.length || typeof XLSX === "undefined") return;
          const columns = [
            ...EXCEL_FIELD_DEFS.map((def) => ({
              header: def.label,
              pick: (_img, c) => pickOutputValue(c, def.aliases),
            })),
            { header: "フォルダ名", pick: (img) => img.task_name || "" },
            { header: "スキャンURL", pick: (img) => img.url || "" },
          ];
          const rows = [
            columns.map((col) => col.header),
            ...this.docs.map((img) => {
              const c = this.getOutputContent(img.output);
              return columns.map((col) => col.pick(img, c));
            }),
          ];
          const ws = XLSX.utils.aoa_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "名刺");
          XLSX.writeFile(wb, `meishi_${this.boardId}_${Date.now()}.xlsx`);
        }
      };
    }
  </script>
</body>
</html>
