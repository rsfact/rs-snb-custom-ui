<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プロンプトリポジトリ | Flexible Board UI</title>
  <link rel="icon" href="https://raw.githubusercontent.com/rsfact/assets/main/favicon.ico" type="image/x-icon" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-50: #eff6ff;
      --yellow-400: #fbbf24;
      --yellow-500: #f59e0b;
      --ink: #0f172a;
      --muted: #64748b;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 100% -20%, rgba(251, 191, 36, 0.18), transparent 50%),
        radial-gradient(ellipse 80% 60% at -10% 100%, rgba(37, 99, 235, 0.12), transparent 45%),
        #f8fafc;
      min-height: 100vh;
    }
    [x-cloak] { display: none !important; }
    .card-surface {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-accent {
      background: linear-gradient(135deg, var(--yellow-500), var(--yellow-400));
      color: #1e293b;
    }
    .folder-item--active {
      border-color: var(--blue-500) !important;
      background: var(--blue-50) !important;
      box-shadow: inset 3px 0 0 var(--blue-500);
    }
    .doc-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col" x-data="cardApp()" x-init="init()" x-cloak>
  <header class="sticky top-0 z-40 border-b border-blue-100/80 bg-white/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center shrink-0 shadow-md shadow-blue-500/25">
          <i class="fa-solid fa-id-card text-sm"></i>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-bold truncate">Flexible Board UI</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-600 px-2 py-1 rounded-lg bg-slate-50">
          <i class="fa-solid fa-user text-[10px] text-blue-500"></i>
          <span x-text="userName"></span>
        </span>
        <button type="button" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" @click="exportCsv()" :disabled="!docs.length">
          <i class="fa-solid fa-file-csv text-amber-500"></i>
          <span class="hidden sm:inline ml-1">CSV出力</span>
        </button>
        <button type="button" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" @click="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-5 flex flex-col lg:flex-row gap-4 min-h-0">
    <aside class="lg:w-64 shrink-0 card-surface rounded-2xl p-3 flex flex-col max-h-[calc(100vh-5.5rem)]">
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wide">フォルダ</h2>
        <button type="button" class="w-8 h-8 rounded-lg btn-accent text-xs font-bold shadow-sm" title="新規フォルダ" @click="createFolder()" :disabled="loading">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto custom-scroll -mx-1 px-1 space-y-1">
        <button type="button" class="w-full text-left px-3 py-2.5 rounded-xl border border-transparent text-sm transition flex items-center gap-2" :class="!selectedFolderId ? 'folder-item--active' : 'hover:bg-slate-50'" @click="selectFolder(null)">
          <i class="fa-solid fa-layer-group text-blue-500 text-xs"></i>
          <span class="font-medium truncate">すべてのドキュメント</span>
        </button>
        <template x-for="folder in folders" :key="folder.id">
          <div class="group flex items-center gap-1 rounded-xl border border-transparent transition" :class="selectedFolderId === folder.id ? 'folder-item--active' : 'hover:bg-slate-50'">
            <button type="button" class="flex-1 min-w-0 text-left px-3 py-2.5 flex items-center gap-2" @click="selectFolder(folder.id)">
              <i class="fa-solid fa-folder text-amber-400 text-xs shrink-0"></i>
              <template x-if="editingFolderId !== folder.id"><span class="text-sm font-medium truncate" x-text="folder.name"></span></template>
              <input x-show="editingFolderId === folder.id" x-model.trim="editingFolderName" type="text" :data-folder-edit="folder.id" class="flex-1 min-w-0 text-sm px-2 py-1 rounded border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-200" maxlength="255" @click.stop @keydown.enter.prevent="submitRenameFolder(folder)" @keydown.esc.prevent="cancelRenameFolder()" @blur="submitRenameFolder(folder)" />
            </button>
            <div class="flex shrink-0 pr-1 opacity-0 group-hover:opacity-100 transition">
              <button type="button" class="w-7 h-7 rounded-md text-slate-500 hover:bg-white" title="名前変更" @click.stop="startRenameFolder(folder)"><i class="fa-solid fa-pen text-[10px]"></i></button>
              <button type="button" class="w-7 h-7 rounded-md text-red-500 hover:bg-red-50" title="削除" @click.stop="requestDeleteFolder(folder)"><i class="fa-regular fa-trash-can text-[10px]"></i></button>
            </div>
          </div>
        </template>
        <p x-show="!folders.length && !loading" class="text-xs text-slate-400 text-center py-4">フォルダがありません</p>
      </div>
    </aside>

    <section class="flex-1 min-w-0 flex flex-col gap-3 min-h-0">
      <div class="card-surface rounded-2xl p-3 md:p-4 flex flex-wrap items-center gap-2">
        <div class="flex-1 min-w-[12rem] relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="search" x-model.debounce.300ms="keyword" placeholder="項目値で検索" class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100" @input="searchDocs(1)" />
        </div>
        <div class="flex items-center gap-1 rounded-xl border border-slate-200 p-0.5 bg-slate-50">
          <button type="button" class="px-2.5 py-1.5 rounded-lg text-xs" :class="viewMode === 'grid' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'" @click="viewMode = 'grid'"><i class="fa-solid fa-grip"></i></button>
          <button type="button" class="px-2.5 py-1.5 rounded-lg text-xs" :class="viewMode === 'table' ? 'bg-white shadow text-blue-600 font-semibold' : 'text-slate-500'" @click="viewMode = 'table'"><i class="fa-solid fa-list"></i></button>
        </div>
      </div>

      <div x-show="viewMode === 'grid'" class="flex-1 overflow-y-auto custom-scroll">
        <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 pb-20">
          <button type="button" class="doc-card min-h-[200px] rounded-2xl border-2 border-dashed border-blue-200 bg-blue-50/40 flex flex-col items-center justify-center gap-2 text-blue-700 transition" @click="triggerUpload()">
            <span class="w-12 h-12 rounded-full btn-primary flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus"></i></span>
            <span class="text-sm font-semibold">追加</span>
          </button>
          <template x-for="doc in docs" :key="doc.id">
            <article class="doc-card card-surface rounded-2xl overflow-hidden border transition cursor-pointer relative" @click="openDetail(doc)">
              <div class="h-28 bg-slate-100 flex items-center justify-center overflow-hidden">
                <template x-if="isPdf(doc.url)"><div class="text-center text-red-500"><i class="fa-solid fa-file-pdf text-2xl"></i><p class="text-[10px] mt-1">PDF</p></div></template>
                <img x-show="!isPdf(doc.url)" :src="doc.url" alt="" class="w-full h-full object-contain" loading="lazy" />
              </div>
              <div class="p-3 space-y-1">
                <p class="text-sm font-bold truncate" x-text="cardTitle(doc)"></p>
                <p class="text-[11px] text-slate-500 truncate" x-text="cardSubtitle(doc)"></p>
                <p x-show="!selectedFolderId && doc.task_name" class="text-[10px] text-blue-600 truncate"><i class="fa-solid fa-folder text-[9px]"></i> <span x-text="doc.task_name"></span></p>
              </div>
            </article>
          </template>
        </div>
      </div>

      <div x-show="viewMode === 'table'" class="flex-1 overflow-auto custom-scroll card-surface rounded-2xl">
        <table class="w-full text-sm text-left">
          <thead class="text-[11px] uppercase text-slate-500 bg-slate-50 border-b sticky top-0">
            <tr><th class="p-2">タイトル</th><th class="p-2">サブタイトル</th><th x-show="!selectedFolderId" class="p-2">フォルダ</th><th class="w-10 p-2"></th></tr>
          </thead>
          <tbody>
            <template x-for="doc in docs" :key="doc.id">
              <tr class="border-b border-slate-100 hover:bg-blue-50/30 cursor-pointer" @click="openDetail(doc)">
                <td class="p-2 font-medium" x-text="cardTitle(doc)"></td>
                <td class="p-2 text-slate-600 truncate max-w-[10rem]" x-text="cardSubtitle(doc)"></td>
                <td x-show="!selectedFolderId" class="p-2 text-xs text-blue-600 truncate max-w-[8rem]" x-text="doc.task_name || '—'"></td>
                <td class="p-2"><button type="button" class="w-7 h-7 text-red-500 hover:bg-red-50 rounded" @click.stop="requestDeleteDoc(doc)"><i class="fa-regular fa-trash-can text-xs"></i></button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <input x-ref="fileInput" type="file" multiple accept="image/*,application/pdf" class="hidden" @change="onFilesSelected($event)" />

  <div x-show="detailOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="absolute inset-0 bg-slate-900/50" @click="closeDetail()"></div>
    <div class="relative z-10 w-full max-w-4xl max-h-[92vh] card-surface rounded-2xl flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b flex items-center justify-between bg-gradient-to-r from-blue-600 to-blue-500 text-white">
        <p class="font-semibold text-sm">詳細</p>
        <button type="button" class="w-8 h-8 rounded-lg hover:bg-white/20" @click="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 grid md:grid-cols-2 gap-4">
        <div class="rounded-xl bg-slate-100 min-h-[240px] flex items-center justify-center overflow-hidden">
          <template x-if="detailDoc && isPdf(detailDoc.url)"><iframe :src="detailDoc.url" class="w-full h-[320px] border-0"></iframe></template>
          <img x-show="detailDoc && !isPdf(detailDoc.url)" :src="detailDoc?.url" class="max-h-[320px] object-contain" alt="" />
        </div>
        <div class="space-y-3">
          <template x-for="field in detailFields" :key="field.key">
            <div>
              <span class="text-[11px] text-slate-500" x-text="field.label"></span>
              <input type="text" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-blue-400" x-model="field.value" @change="saveField()" />
            </div>
          </template>
        </div>
      </div>
      <div class="px-4 py-3 border-t flex flex-wrap justify-end gap-2">
        <button type="button" class="px-3 py-2 rounded-xl border text-sm" @click="closeDetail()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    function cardApp() {
      const params = new URLSearchParams(window.location.search);
      const SNB_ORIGIN = "";
      const API_BASE = SNB_ORIGIN ? `${SNB_ORIGIN.replace(/\/+$/, "")}/snb/api` : new URL("/snb/api", window.location.origin).toString();
      const TOKEN_KEYS = ["snb_customer_token", "snb_token"];
      const NAME_KEYS = ["snb_customer_name", "snb_user_name"];

      function readToken() { for (const k of TOKEN_KEYS) { const t = localStorage.getItem(k); if (t) return t; } return ""; }
      function readName() { for (const k of NAME_KEYS) { const v = localStorage.getItem(k); if (v) return v; } return "ゲスト"; }
      function clearAuth() { for (const k of TOKEN_KEYS) localStorage.removeItem(k); for (const k of NAME_KEYS) localStorage.removeItem(k); }

      return {
        boardId: "",
        selectedFolderId: null,
        token: "",
        userName: "ゲスト",
        folders: [],
        docs: [],
        keyword: "",
        viewMode: "grid",
        loading: false,
        editingFolderId: null,
        editingFolderName: "",
        detailOpen: false,
        detailDoc: null,
        detailFields: [],
        pendingUploadTarget: null,

        init() {
          this.boardId = params.get("board_id") || "";
          this.selectedFolderId = params.get("task_id") || null;
          this.token = readToken();
          this.userName = readName();
          if (!this.boardId || !this.token) return this.redirectLogin();
          this.bootstrap();
        },
        api(path, options = {}) {
          return fetch(`${API_BASE}/v1${path}`, {
            ...options,
            headers: { accept: "application/json", Authorization: `Bearer ${this.token}`, ...(options.headers || {}) }
          });
        },
        async apiJson(path, options = {}) {
          const res = await this.api(path, options);
          const json = await res.json().catch(() => ({}));
          if (res.status === 401) { clearAuth(); this.redirectLogin(); throw new Error("unauthorized"); }
          if (res.status === 403) throw new Error("forbidden");
          if (!res.ok || json.success === false) throw new Error("api error");
          return json;
        },
        redirectLogin() {
          const u = new URL("./login.html", window.location.href);
          if (this.boardId) u.searchParams.set("board_id", this.boardId);
          if (this.selectedFolderId) u.searchParams.set("task_id", this.selectedFolderId);
          window.location.replace(u.toString());
        },
        logout() { clearAuth(); this.redirectLogin(); },
        async bootstrap() { await this.loadFolders(); await this.searchDocs(); },
        async loadFolders() {
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/search`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page: 1, size: 200, is_include_archived: false })
          });
          this.folders = json.data?.items || [];
        },
        async searchDocs(page = 1) {
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page, size: 30, task_id: this.selectedFolderId || null, keyword: this.keyword || "", is_done: true, sort: "created_at_desc" })
          });
          this.docs = (json.data?.items || []).flatMap((g) => (g.imgs || []).map((img) => ({ ...img, task_name: g.task?.name || "" })));
        },
        selectFolder(id) { this.selectedFolderId = id; this.searchDocs(1); },
        async createFolder() {
          const now = new Date().toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
          const json = await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: now }) });
          await this.loadFolders();
          this.selectFolder(json.data?.id || null);
        },
        startRenameFolder(folder) { this.editingFolderId = folder.id; this.editingFolderName = folder.name || ""; },
        cancelRenameFolder() { this.editingFolderId = null; this.editingFolderName = ""; },
        async submitRenameFolder(folder) {
          if (!this.editingFolderName || this.editingFolderName === folder.name) return this.cancelRenameFolder();
          await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(folder.id)}`, {
            method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: this.editingFolderName })
          });
          this.cancelRenameFolder();
          await this.loadFolders();
        },
        async requestDeleteFolder(folder) {
          if (!window.confirm(`「${folder.name}」を削除しますか？`)) return;
          await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(folder.id)}`, { method: "DELETE" });
          if (this.selectedFolderId === folder.id) this.selectedFolderId = null;
          await this.loadFolders();
          await this.searchDocs(1);
        },
        getOutputContent(output) {
          if (!output || typeof output !== "object") return {};
          if (output.content && typeof output.content === "object") return { ...output.content };
          return { ...output };
        },
        getOutputLabels(output) {
          if (!output || typeof output !== "object") return {};
          return output.labels && typeof output.labels === "object" ? output.labels : {};
        },
        cardTitle(doc) {
          const c = this.getOutputContent(doc.output);
          return c.name || c.title || c.subject || c.full_name || c.person_name || "（タイトルなし）";
        },
        cardSubtitle(doc) {
          const c = this.getOutputContent(doc.output);
          return c.company || c.company_name || c.category || c.department || "";
        },
        isPdf(url) { return String(url || "").split("?")[0].toLowerCase().endsWith(".pdf"); },
        openDetail(doc) {
          this.detailDoc = doc;
          const content = this.getOutputContent(doc.output);
          const labels = this.getOutputLabels(doc.output);
          const keys = [...new Set([...Object.keys(labels), ...Object.keys(content)])];
          this.detailFields = keys.map((key) => ({ key, label: labels[key] || key, value: content[key] != null ? String(content[key]) : "" }));
          this.detailOpen = true;
        },
        closeDetail() { this.detailOpen = false; this.detailDoc = null; this.detailFields = []; },
        async saveField() {
          if (!this.detailDoc) return;
          const output = this.detailDoc.output && typeof this.detailDoc.output === "object" ? JSON.parse(JSON.stringify(this.detailDoc.output)) : {};
          const content = {};
          this.detailFields.forEach((f) => { content[f.key] = f.value; });
          const nextOutput = output.content && typeof output.content === "object" ? { ...output, content: { ...output.content, ...content } } : { ...output, ...content };
          await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(this.detailDoc.task_id)}/imgs/${encodeURIComponent(this.detailDoc.id)}`, {
            method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ output: nextOutput })
          });
          await this.searchDocs(1);
        },
        async requestDeleteDoc(doc) {
          if (!window.confirm("削除しますか？")) return;
          await this.apiJson(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(doc.task_id)}/imgs/${encodeURIComponent(doc.id)}`, { method: "DELETE" });
          await this.searchDocs(1);
        },
        triggerUpload() {
          if (!this.folders.length) return alert("先にフォルダを作成してください");
          this.pendingUploadTarget = this.selectedFolderId || this.folders[0]?.id;
          this.$refs.fileInput.click();
        },
        async onFilesSelected(event) {
          const files = Array.from(event.target?.files || []);
          const taskId = this.pendingUploadTarget;
          event.target.value = "";
          if (!files.length || !taskId) return;
          for (const file of files) {
            const fd = new FormData();
            fd.append("img", file);
            await this.api(`/boards/${encodeURIComponent(this.boardId)}/tasks/${encodeURIComponent(taskId)}/imgs`, { method: "POST", body: fd });
          }
          await this.searchDocs(1);
        },
        exportCsv() {
          if (!this.docs.length) return;
          const rows = this.docs.map((img) => {
            const c = this.getOutputContent(img.output);
            return { ...c, _url: img.url || "", _folder: img.task_name || "" };
          });
          const keys = [...new Set(rows.flatMap((r) => Object.keys(r).filter((k) => !k.startsWith("_"))))];
          const header = [...keys, "url", "folder"];
          const lines = [header.map((h) => `"${String(h).replace(/"/g, '""')}"`).join(",")];
          rows.forEach((r) => {
            lines.push([...keys.map((k) => `"${String(r[k] ?? "").replace(/"/g, '""')}"`), `"${r._url}"`, `"${r._folder}"`].join(","));
          });
          const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `export_${this.boardId}_${Date.now()}.csv`;
          a.click();
          URL.revokeObjectURL(a.href);
        }
      };
    }
  </script>
</body>
</html>
