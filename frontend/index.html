<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サンプルビュー</title>
  <link rel="icon" href="https://raw.githubusercontent.com/rsfact/assets/main/favicon.ico" type="image/x-icon" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --color-bg: #fafafa;
      --color-black: #333;
      --color-primary: #799bf9;
      --color-accent: #ffa775;
      --color-danger: #ff5151;
    }
    body {
      margin: 0;
      background-color: #f8fafc;
      background-image:
        linear-gradient(to bottom, transparent 31px, rgba(99, 102, 241, 0.1) 31px, rgba(99, 102, 241, 0.1) 32px),
        radial-gradient(circle, rgba(99, 102, 241, 0.14) 0.9px, transparent 1px);
      background-size: 100% 32px, 24px 32px;
      background-position: 0 0, 0 31px;
      color: var(--color-black);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-indigo-100 bg-white/80 backdrop-blur-sm">
    <div class="max-w-5xl mx-auto h-14 px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-table-list text-[var(--color-primary)]"></i>
        <h1 class="font-semibold">サンプルビュー</h1>
      </div>
      <div class="flex items-center gap-2">
        <div class="inline-flex items-center gap-1.5 px-1 py-1 text-xs text-gray-600">
          <i class="fa-solid fa-user text-[10px]"></i>
          <span id="userName">ゲスト</span>
        </div>
        <button id="logoutButton" type="button" class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>ログアウト</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-3 md:p-6">
    <div class="flex justify-end mb-3">
      <button
        id="exportCsvButton"
        type="button"
        class="inline-flex items-center gap-2 text-sm px-4 py-2 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed"
        disabled
      >
        <i class="fa-solid fa-file-csv"></i>
        <span>CSV出力</span>
      </button>
    </div>
    <section id="contentSection" class="rounded-2xl p-3 md:p-5 min-h-[360px] flex flex-col bg-transparent border-none shadow-none">
      <div id="taskHeader" class="mb-4 text-center">
        <h2 id="taskName" class="font-bold text-lg md:text-xl">読み込み中...</h2>
      </div>

      <div id="stateMessage" class="flex-1 flex items-center justify-center text-center text-sm text-gray-500 px-2">
        データを読み込み中です...
      </div>

      <div id="imgList" class="hidden rounded-xl border border-gray-200 bg-white/80 overflow-hidden"></div>
    </section>
  </main>

  <div id="modal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/35" id="modalBackdrop"></div>
    <div class="relative z-10 w-full h-full p-4 md:p-8 flex items-center justify-center">
      <div class="w-full max-w-3xl max-h-[90vh] overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl flex flex-col">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
          <p class="font-semibold text-sm">読み取り結果</p>
          <button id="closeModalButton" type="button" class="w-8 h-8 rounded-lg hover:bg-gray-100">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="p-4 md:p-5 overflow-auto">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-5 rounded-xl border border-gray-100 bg-gray-50 p-3">
              <div id="modalPreview" class="h-[320px] flex items-center justify-center"></div>
              <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center gap-2 text-xs text-[var(--color-primary)] hover:underline">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                元ファイルを開く
              </a>
            </div>
            <div class="md:col-span-7">
              <div id="modalFields" class="space-y-2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // AI が対話の最初にユーザーから聞いたメインシステムの URL（例: "https://example.com"）
    // サーバーに配置して使うときは空文字のままでよい
    const SNB_ORIGIN = "";
    const API_BASE = SNB_ORIGIN
      ? `${SNB_ORIGIN.replace(/\/+$/, "")}/snb/api`
      : new URL("/snb/api", window.location.origin).toString();
    const TOKEN_KEY = "snb_customer_token";
    const params = new URLSearchParams(window.location.search);
    const boardId = params.get("board_id") || "";
    const taskId = params.get("task_id") || "";
    const token = localStorage.getItem(TOKEN_KEY) || "";
    const cachedCustomerName = localStorage.getItem("snb_customer_name") || "";

    const stateMessage = document.getElementById("stateMessage");
    const imgList = document.getElementById("imgList");
    const taskNameEl = document.getElementById("taskName");
    const taskHeaderEl = document.getElementById("taskHeader");
    const contentSectionEl = document.getElementById("contentSection");
    const userNameEl = document.getElementById("userName");
    const modal = document.getElementById("modal");
    const modalPreview = document.getElementById("modalPreview");
    const modalFields = document.getElementById("modalFields");
    const modalLink = document.getElementById("modalLink");
    const exportCsvButton = document.getElementById("exportCsvButton");
    let currentImgs = [];
    let currentTaskName = "";

    if (cachedCustomerName) {
      userNameEl.textContent = cachedCustomerName;
    }

    function showCenteredMessage(message, isPlain = false) {
      stateMessage.textContent = message;
      stateMessage.classList.remove("hidden");
      stateMessage.className = "flex-1 flex items-center justify-center text-center text-sm text-gray-500 px-2";
      imgList.classList.add("hidden");
      imgList.innerHTML = "";
      taskHeaderEl.classList.toggle("hidden", isPlain);
      contentSectionEl.className = "rounded-2xl p-3 md:p-5 min-h-[360px] flex flex-col bg-transparent border-none shadow-none";
    }

    function redirectLogin() {
      const loginUrl = new URL("./login.html", window.location.href);
      if (boardId) loginUrl.searchParams.set("board_id", boardId);
      if (taskId) loginUrl.searchParams.set("task_id", taskId);
      window.location.href = loginUrl.toString();
    }

    function isPdf(url) {
      return String(url || "").split("?")[0].toLowerCase().endsWith(".pdf");
    }

    function normalizeOutput(output) {
      const data = output && typeof output === "object" ? output : {};
      if (data.content && typeof data.content === "object") {
        const labels = data.labels && typeof data.labels === "object" ? data.labels : {};
        const keys = [...Object.keys(labels), ...Object.keys(data.content).filter((k) => !Object.prototype.hasOwnProperty.call(labels, k))];
        return keys.map((key) => ({ key, label: labels[key] || key, value: data.content[key] ?? "" }));
      }
      return Object.keys(data).map((key) => ({ key, label: key, value: data[key] ?? "" }));
    }

    function toCsvCell(value) {
      if (value === null || value === undefined) return "";
      const text = typeof value === "string" ? value : JSON.stringify(value);
      return `"${String(text).replace(/"/g, "\"\"")}"`;
    }

    function buildOutputRecord(output) {
      const data = output && typeof output === "object" ? output : {};
      const source = data.content && typeof data.content === "object" ? data.content : data;
      const labels = data.labels && typeof data.labels === "object" ? data.labels : {};
      const record = {};
      Object.keys(source || {}).forEach((key) => {
        const value = source[key];
        if (value === null || value === undefined) {
          record[key] = "";
        } else if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") {
          record[key] = value;
        } else {
          record[key] = JSON.stringify(value);
        }
      });
      return { record, labels };
    }

    function downloadCsv() {
      if (!currentImgs.length) return;

      const dynamicColumns = [];
      const seen = new Set();
      const rows = currentImgs.map((img) => {
        const { record, labels } = buildOutputRecord(img.output);
        Object.keys(record).forEach((key) => {
          if (!seen.has(key)) {
            seen.add(key);
            dynamicColumns.push({
              key,
              label: labels[key] || key
            });
          }
        });
        return { record, img_url: img.url || "" };
      });

      const headers = [...dynamicColumns.map((column) => column.label), "url"];
      const lines = [headers.map(toCsvCell).join(",")];
      rows.forEach((row) => {
        const values = [
          ...dynamicColumns.map((column) => toCsvCell(row.record[column.key] ?? "")),
          toCsvCell(row.img_url)
        ];
        lines.push(values.join(","));
      });

      const csvContent = `\uFEFF${lines.join("\n")}`;
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const safeTaskName = String(currentTaskName || taskId || "task").replace(/[\\/:*?"<>|]/g, "_");
      anchor.href = url;
      anchor.download = `${safeTaskName}_export.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    function openModal(img) {
      const previewUrl = img.url || "#";
      modalLink.href = previewUrl;
      modalPreview.innerHTML = "";
      if (isPdf(previewUrl)) {
        const iframe = document.createElement("iframe");
        iframe.src = previewUrl;
        iframe.className = "w-full h-full rounded-lg border border-gray-100 bg-white";
        iframe.title = "PDF preview";
        modalPreview.appendChild(iframe);
      } else {
        const image = document.createElement("img");
        image.src = previewUrl;
        image.alt = "preview";
        image.className = "w-full h-full object-contain rounded-lg border border-gray-100 bg-white";
        modalPreview.appendChild(image);
      }

      modalFields.innerHTML = "";
      const fields = normalizeOutput(img.output);
      if (!fields.length) {
        const empty = document.createElement("p");
        empty.className = "text-sm text-gray-500";
        empty.textContent = "表示できる出力項目がありません。";
        modalFields.appendChild(empty);
      } else {
        fields.forEach((field) => {
          const row = document.createElement("div");
          row.className = "rounded-lg border border-gray-100 px-3 py-2";
          row.innerHTML = `<p class="text-[11px] text-gray-500">${field.label}</p><p class="text-sm font-medium whitespace-pre-wrap break-all">${field.value || "—"}</p>`;
          modalFields.appendChild(row);
        });
      }
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem("snb_customer_name");
      redirectLogin();
    }

    async function fetchTask() {
      if (!boardId || !taskId || !token) {
        redirectLogin();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/v1/boards/${encodeURIComponent(boardId)}/tasks/${encodeURIComponent(taskId)}`, {
          method: "GET",
          headers: {
            accept: "application/json",
            Authorization: `Bearer ${token}`
          }
        });

        if (res.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          redirectLogin();
          return;
        }

        const json = await res.json();
        if (!res.ok || !json.success || !json.data) {
          if (res.status === 403) {
            showCenteredMessage("このURLからはご覧いただけません。", true);
            return;
          }
          throw new Error("タスク取得に失敗しました");
        }

        const task = json.data;
        taskNameEl.textContent = task.name || "タスク";
        currentTaskName = task.name || "";
        if (task.user && task.user.name) {
          userNameEl.textContent = task.user.name;
          localStorage.setItem("snb_customer_name", task.user.name);
        }
        const imgs = Array.isArray(task.imgs) ? task.imgs : [];
        currentImgs = imgs;
        exportCsvButton.disabled = imgs.length === 0;

        if (!imgs.length) {
          showCenteredMessage("表示できる画像がありません。");
          return;
        }

        stateMessage.classList.add("hidden");
        imgList.classList.remove("hidden");
        imgList.innerHTML = "";
        const table = document.createElement("table");
        table.className = "w-full text-left";

        const tbody = document.createElement("tbody");
        imgs.forEach((img, idx) => {
          const displayName =
            (img.output && img.output.content && img.output.content.name) ||
            (img.output && img.output.name) ||
            "（氏名なし）";

          const row = document.createElement("tr");
          row.className = "cursor-pointer hover:bg-indigo-50/50 transition border-b border-gray-100 last:border-b-0";
          row.innerHTML = `
            <td class="align-middle px-3 py-3 w-[44%]">
              <p class="text-[11px] text-gray-500 mb-1">#${idx + 1}</p>
              <p class="text-sm md:text-base font-semibold break-words">${displayName}</p>
            </td>
            <td class="align-middle px-3 py-3">
              <div class="rounded-lg border border-gray-100 bg-gray-50 h-20 sm:h-24 md:h-28 overflow-hidden flex items-center justify-center">
                ${
                  isPdf(img.url)
                    ? `<div class="text-center text-rose-500"><i class="fa-solid fa-file-pdf text-2xl md:text-3xl"></i><p class="text-[10px] mt-1">PDF</p></div>`
                    : `<img src="${img.url || ""}" alt="preview" class="w-full h-full object-contain" />`
                }
              </div>
            </td>
          `;
          row.addEventListener("click", () => openModal(img));
          tbody.appendChild(row);
        });
        table.appendChild(tbody);
        imgList.appendChild(table);
      } catch (error) {
        showCenteredMessage(error.message || "読み込みに失敗しました。");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", logout);
    exportCsvButton.addEventListener("click", downloadCsv);
    document.getElementById("closeModalButton").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", closeModal);

    fetchTask();
  </script>
</body>
</html>
